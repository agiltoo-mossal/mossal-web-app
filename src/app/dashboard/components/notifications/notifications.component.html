<div class="notif-tabs">
  <span class="tab" [class.active]="activeTab === 'toutes'" (click)="setActiveTab('toutes')">Toutes</span>
  <span class="tab" [class.active]="activeTab === 'non-lues'" (click)="setActiveTab('non-lues')">Non lues</span>
  <span class="tab" [class.active]="activeTab === 'lues'" (click)="setActiveTab('lues')">Lues</span>
</div>
<div class="page-wrapper notif-list-container">
  <div matSort class="notif" fxLayout="column" fxLayoutGap="13px"
    (click)="onNotifClick(notif)" *ngFor="let notif of filteredNotifs">
    <div fxLayout="row" fxLayoutAlign="space-between start">
      <span class="notif-title">{{ notif.title }}</span>
      <span class="date-and-destinatary" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
        <span class="date">{{ notif.date | frenchDate }}</span>
        <span class="separator"></span>
        <span class="collobator">par {{ notif.author.firstName }} {{ notif.author.lastName }}</span>
      </span>
    </div>
    <div class="notif-content text-on-2-line">
      {{ notif.content }}
    </div>
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [length]="resultsLength" aria-label=""></mat-paginator>
</div>
