mutation AddCredit($creditInput: CreditInput!, $organizationId: ID!) {
  addCredit(creditInput: $creditInput, organizationId: $organizationId)
  {
    id
  }
}

query FetchPaginatedOperations($queryFilter: QueryDataConfigInput, $organizationId: ID!, 
								$metricsInput: OperationsMetricsInput) {
	fetchPaginatedOperations(queryFilter: $queryFilter, organizationId: $organizationId, metricsInput: $metricsInput) {
		pagination {
			totalItems
			pageCount
			currentPage
			pageSize
		}
		results {
			id
			amount
			createdAt
			type
			matricule
			collaborator
			numeroOperation
		}
	}
}

query FetchOperations($organizationId: ID!) {
  fetchOperations(organizationId: $organizationId) {
    matricule
    collaborator
    date
    operation
    numeroOperation
    montant
  }
}
# Super admin Mossall : demandes d'une organisation (page « Liste des demandes »).
query FetchPaginatedDemandesByOrganization(
  $organizationId: ID!
  $metricsInput: DemandesMetricsInput
  $queryFilter: QueryDataConfigInput
) {
  fetchPaginatedDemandesByOrganization(
    organizationId: $organizationId
    metricsInput: $metricsInput
    queryFilter: $queryFilter
  ) {
    pagination {
      totalItems
      pageCount
      currentPage
      pageSize
    }
    results {
      id
      number
      amount
      fees
      status
      createdAt
      collaborator {
        id
        firstName
        lastName
        uniqueIdentifier
      }
    }
  }
}
