mutation CreateBulkPaymentOrder($inputs: [BulkPaymentInput!]!, $label: String!, $isDraft: Boolean, $type: String) {
  createBulkPaymentOrder(inputs: $inputs, label: $label, isDraft: $isDraft, type: $type) {
    id
    label
    totalAmount
    status
    createdAt
  }
}

