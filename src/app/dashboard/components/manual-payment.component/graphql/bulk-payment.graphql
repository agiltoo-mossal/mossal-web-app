mutation CreateBulkPaymentOrder($inputs: [BulkPaymentInput!]!, $label: String!, $isDraft: Boolean) {
  createBulkPaymentOrder(inputs: $inputs, label: $label, isDraft: $isDraft) {
    id
    label
    totalAmount
    status
    createdAt
  }
}

mutation SubmitBulkPaymentOrder($id: String!) {
  submitBulkPaymentOrder(id: $id) {
    id
    status
  }
}

query FetchBulkPaymentOrderById($id: String!) {
  fetchBulkPaymentOrderById(id: $id) {
    id
    label
    totalAmount
    status
    payments {
      id
      firstName
      lastName
      phoneNumber
      amount
      wallet
    }
    approvers {
      id
      firstName
      lastName
    }
  }
}
