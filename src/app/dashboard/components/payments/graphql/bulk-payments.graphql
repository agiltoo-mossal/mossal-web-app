query FetchMyBulkPayments {
  fetchMyBulkPayments {
    id
    number
    firstName
    lastName
    phoneNumber
    amount
    status
    wallet
    organization
    createdBy
    createdAt
    updatedAt
  }
}

query FetchMyBulkPaymentOrders {
  fetchMyBulkPaymentOrders {
    id
    label
    totalAmount
    status
    approvers {
      id
      firstName
      lastName
    }
    createdAt
  }
}
